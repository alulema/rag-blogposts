name: Build & push images (GHCR)

# Construye y publica las 3 imágenes del demo (app, ollama, db) en GHCR.
# La imagen `db` hornea el `db/dump.sql` COMMITEADO (no regenera embeddings aquí; eso es
# refresh-corpus.yml). Marca los packages como Public tras el primer push (Settings del package).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: app
            dockerfile: Dockerfile
          - service: ollama
            dockerfile: Dockerfile.ollama
          - service: db
            dockerfile: db/Dockerfile.db
    steps:
      - uses: actions/checkout@v5

      # torch + embeddings (app) y Qwen (ollama) son grandes: libera espacio en el runner.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /opt/hostedtoolcache/CodeQL || true
          df -h

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/rag-demo-${{ matrix.service }}:latest
            ghcr.io/${{ github.repository_owner }}/rag-demo-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
